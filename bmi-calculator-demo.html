<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .calculator {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result {
            font-size: 1.5rem;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2 class="text-center mb-4">BMI Calculator</h2>
        <div class="mb-3">
            <label class="form-label">Height (cm)</label>
            <input type="number" class="form-control" value="170">
        </div>
        <div class="mb-3">
            <label class="form-label">Weight (kg)</label>
            <input type="number" class="form-control" value="70">
        </div>
        <button class="btn btn-primary w-100">Calculate BMI</button>
        <div class="result text-center mt-3">
            Your BMI: 24.2
        </div>
    </div>
</body>
</html>
