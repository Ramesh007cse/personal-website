<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Prediction Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .demo-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .temp-display {
            font-size: 3rem;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Temperature Prediction</h1>
        <div class="temp-display">
            24°C
        </div>
        <p>Real-time temperature predictions using weather API data</p>
        <div class="mt-4">
            <button class="btn btn-primary">Refresh Prediction</button>
        </div>
    </div>
</body>
</html>
